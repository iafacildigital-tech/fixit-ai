<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FixIT AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔐 PROTEGER ACCESO -->
<script>
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "/login.html";
  }
</script>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Segoe UI', Arial;
  background: radial-gradient(circle at top, #021124, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* CONTENEDOR */
.app {
  width: 320px;
  height: 650px;
  background: linear-gradient(180deg, #031c3b, #020617);
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 0 40px rgba(0,150,255,0.4);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* BOTONES */
.top {
  display: flex;
  justify-content: space-between;
}

.btn {
  padding: 5px 10px;
  border-radius: 10px;
  border: none;
  font-size: 12px;
  cursor: pointer;
}

.logout {
  background: #111827;
  color: #00c3ff;
  border: 1px solid #00c3ff;
}

/* ESFERA IA */
.ai {
  width: 100px;
  height: 100px;
  margin: 10px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #00c3ff, #003366);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 0 30px #00c3ff;
}

/* INPUT */
textarea {
  width: 100%;
  height: 60px;
  border-radius: 20px;
  border: 2px solid #00c3ff;
  background: transparent;
  color: white;
  padding: 10px;
  outline: none;
  resize: none;
  text-align: center;
}

/* BOTÓN */
.send {
  margin-top: 10px;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(90deg, #00c3ff, #007bff);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* RESPUESTA */
.resp {
  font-size: 13px;
  max-height: 200px;
  overflow-y: auto;
}
</style>
</head>

<body>

<div class="app">

  <!-- 🔝 BOTÓN SALIR -->
  <div class="top">
    <button class="btn logout" onclick="logout()">Salir</button>
  </div>

  <!-- 🤖 IA -->
  <div>
    <div class="ai">AI</div>
    <div style="text-align:center;">Ask anything to FixIT AI</div>
  </div>

  <!-- 📸 INPUT -->
  <div>

    <!-- TEXTO -->
    <textarea id="problema" placeholder="Describe tu problema..."></textarea>

    <!-- IMAGEN -->
    <input type="file" id="imagen" accept="image/*" style="margin-top:10px;">

    <!-- PREVIEW -->
    <img id="preview" style="width:100%; margin-top:10px; display:none; border-radius:10px;">

    <!-- BOTÓN -->
    <button class="send" onclick="enviar()">Enviar</button>

  </div>

  <!-- RESPUESTA -->
  <div id="respuesta" class="resp"></div>

</div>

<script>

// ===============================
// 🔐 OBTENER TOKEN
// ===============================
function getToken() {
  return localStorage.getItem("token");
}

// ===============================
// 🚪 LOGOUT
// ===============================
function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login.html";
}

// ===============================
// 📸 PREVIEW (SIN ERRORES)
// ===============================
window.onload = function () {

  const imagenInput = document.getElementById("imagen");
  const preview = document.getElementById("preview");

  if (imagenInput && preview) {
    imagenInput.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });
  }

};

// ===============================
// 🤖 ENVIAR A IA
// ===============================
async function enviar() {

  const problemaInput = document.getElementById("problema");
  const imagenInput = document.getElementById("imagen");

  const problema = problemaInput.value;

  // VALIDACIÓN
  if (!problema && (!imagenInput || !imagenInput.files[0])) {
    alert("Escribe algo o sube una imagen");
    return;
  }

  const formData = new FormData();
  formData.append("problema", problema);

  if (imagenInput && imagenInput.files[0]) {
    formData.append("imagen", imagenInput.files[0]);
  }

  try {

    const res = await fetch("/analizar", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + getToken()
      },
      body: formData
    });

    const data = await res.json();

    document.getElementById("respuesta").innerHTML = `
🔍 ${data.problema}<br><br>
🧠 ${data.tipo}<br><br>
🛠️ ${data.solucion}
`;

    // 🧹 LIMPIAR CAMPOS
    problemaInput.value = "";

    if (imagenInput) imagenInput.value = "";
    const preview = document.getElementById("preview");
    if (preview) preview.style.display = "none";

  } catch (error) {
    console.error("Error:", error);
    alert("Error conectando con el servidor");
  }
}

</script>

</body>
</html>
